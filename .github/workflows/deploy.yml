name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site with prebuilt fallback
        run: |
          if npm install --legacy-peer-deps && npm run build && [ -f dist/index.html ]; then
            echo "DEPLOY_DIR=./dist" >> "$GITHUB_ENV"
          elif [ -f docs/index.html ]; then
            echo "DEPLOY_DIR=./docs" >> "$GITHUB_ENV"
          else
            echo "Build failed and no prebuilt docs/index.html found."
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DEPLOY_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
